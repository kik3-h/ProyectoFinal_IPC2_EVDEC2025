<div class="card vaq-card">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center">
      <h3 class="mb-0">Cartera</h3>
      <button class="btn btn-outline-primary" (click)="refrescar()">Refrescar</button>
    </div>

    @if (alert) {
      <div class="alert mt-3" [class.alert-success]="alert.type==='success'" [class.alert-danger]="alert.type==='danger'">
        {{alert.msg}}
      </div>
    }

    @if (loading) {
      <div class="py-4 text-muted">Cargando...</div>
    } @else {
      <div class="mt-3 d-flex flex-wrap gap-3 align-items-center">
        <div class="p-3 rounded bg-light border">
          <div class="text-muted small">Saldo actual</div>
          <div class="fs-4 fw-bold">Q {{saldo}}</div>
        </div>

        <div class="p-3 rounded bg-light border flex-grow-1" style="min-width: 280px;">
          <div class="text-muted small mb-1">Recargar</div>
          <div class="d-flex gap-2">
            <input type="number" class="form-control" [(ngModel)]="monto" placeholder="Monto (Q)">
            <button class="btn btn-primary" (click)="recargar()">Recargar</button>
          </div>
        </div>
      </div>

      <h5 class="mt-4">Historial de recargas</h5>
      @if (!recargas.length) {
        <div class="text-muted">Sin recargas.</div>
      } @else {
        <div class="table-responsive">
          <table class="table">
            <thead><tr><th>Monto</th><th>Fecha</th></tr></thead>
            <tbody>
              @for (r of recargas; track $index) {
                <tr>
                  <td>Q {{r.monto}}</td>
                  <td class="text-muted">{{r.fecha || ''}}</td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    }
  </div>
</div>
