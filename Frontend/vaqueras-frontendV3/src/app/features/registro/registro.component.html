<div class="container py-4" style="max-width: 860px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Crear cuenta</h2>
    <a class="btn btn-outline-light" routerLink="/login">Ya tengo cuenta</a>
  </div>

  @if (alert) {
    <div class="alert" [class.alert-success]="alert.type==='success'" [class.alert-danger]="alert.type==='danger'">
      {{ alert.msg }}
    </div>
  }

  <div class="card vaq-card">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nickname</label>
          <input class="form-control" [(ngModel)]="form.nickname" placeholder="ej: kike123" />
        </div>

        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input class="form-control" [(ngModel)]="form.email" type="email" placeholder="ej: correo@vaqueras.com" />
        </div>

        <div class="col-md-6">
          <label class="form-label">Password</label>
          <input class="form-control" [(ngModel)]="form.password" type="password" placeholder="********" />
        </div>

        <div class="col-md-6">
          <label class="form-label">Teléfono</label>
          <input class="form-control" [(ngModel)]="form.telefono" placeholder="12345678" />
        </div>

        <div class="col-md-6">
          <label class="form-label">Fecha nacimiento</label>
          <input class="form-control" [(ngModel)]="form.fechaNacimiento" type="date" />
        </div>

        <div class="col-md-3">
          <label class="form-label">País</label>
          <input class="form-control" [(ngModel)]="form.pais" placeholder="GT" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Rol</label>
          <select class="form-select" [(ngModel)]="form.rol">
            @for (r of roles; track r) {
              <option [ngValue]="r">{{ r }}</option>
            }
          </select>
          <div class="form-text">
            Recomendado: <b>GAMER</b>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary" (click)="registrar()" [disabled]="loading">
          {{ loading ? 'Creando...' : 'Crear cuenta' }}
        </button>
        <a class="btn btn-outline-light" routerLink="/home">Cancelar</a>
      </div>
    </div>
  </div>
</div>
